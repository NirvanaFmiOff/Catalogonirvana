<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirvana Check - Catálogo de iPhones</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00ffcc;
            margin-bottom: 5px;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .card h3 {
            margin: 15px 0 5px 0;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>NIRVANA CHECK - CATÁLOGO</h1>
    <p>Modelos de dispositivos disponibles</p>

    <div class="grid">
        <div class="card">
            <img src="iphone-11.png" alt="iPhone 11">
            <h3>iPhone 11</h3>
        </div>
        <div class="card">
            <img src="iphone-11pro.png" alt="iPhone 11 Pro">
            <h3>iPhone 11 Pro</h3>
        </div>
        <div class="card">
            <img src="iphone-11pro-max.png" alt="iPhone 11 Pro Max">
            <h3>iPhone 11 Pro Max</h3>
        </div>
        <div class="card">
            <img src="iphone-12.png" alt="iPhone 12">
            <h3>iPhone 12</h3>
        </div>
        <div class="card">
            <img src="iphone-12-mini.png" alt="iPhone 12 Mini">
            <h3>iPhone 12 Mini</h3>
        </div>
        <div class="card">
            <img src="iphone-12-pro.png" alt="iPhone 12 Pro">
            <h3>iPhone 12 Pro</h3>
        </div>
        <div class="card">
            <img src="iphone-12-pro-max.png" alt="iPhone 12 Pro Max">
            <h3>iPhone 12 Pro Max</h3>
        </div>
        <div class="card">
            <img src="iphone-13.png" alt="iPhone 13">
            <h3>iPhone 13</h3>
        </div>
        <div class="card">
            <img src="iphone-13-mini.png" alt="iPhone 13 Mini">
            <h3>iPhone 13 Mini</h3>
        </div>
    </div>

</body>
</html>
